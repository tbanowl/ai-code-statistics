version: '3.8'

services:
  # PostgreSQL 数据库
  postgres:
    image: postgres:15-alpine
    container_name: git-ai-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-gitai}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-gitai_stats}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./sql:/docker-entrypoint-initdb.d:ro
    networks:
      - git-ai-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-gitai} -d ${POSTGRES_DB:-gitai_stats}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Flask Web 应用
  flask:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        BUILD_FRONTEND: ${BUILD_FRONTEND:-0}
    container_name: git-ai-flask
    restart: unless-stopped
    environment:
      # 数据库配置（覆盖 config.yaml）
      DB_PASSWORD: ${DB_PASSWORD}
      POSTGRES_USER: ${POSTGRES_USER:-gitai}
      POSTGRES_DB: ${POSTGRES_DB:-gitai_stats}
      # 应用配置
      SECRET_KEY: ${GIT_AI_OAUTH_SECRET}
      GIT_AI_OAUTH_SECRET: ${GIT_AI_OAUTH_SECRET}
      RELEASE_VERSION: ${RELEASE_VERSION:-2.0.0}
    volumes:
      # 数据持久化
      - app_data:/app/data
      # 日志映射（可选）
      - app_logs:/app/.logs
    networks:
      - git-ai-network
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:5000/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Nginx 反向代理
  nginx:
    image: nginx:alpine
    container_name: git-ai-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./.docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./static:/usr/share/nginx/html:ro
    networks:
      - git-ai-network
    depends_on:
      flask:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

networks:
  git-ai-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  app_data:
    driver: local
  app_logs:
    driver: local
