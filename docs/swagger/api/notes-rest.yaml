openapi: 3.0.0
info:
  title: REST Notes Store API
  version: 2.0.0
  description: API for storing and retrieving authorship notes when git notes is not supported.

tags:
  - name: notes_rest
    description: REST Notes Store API - 用于存储和检索作者注释（当 git notes 不被支持时）

paths:
  /worker/notes:
    put:
      summary: Create or update a single note
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - repo_url
                - branch
                - commit_sha
                - author_name
                - author_email
                - content
              properties:
                repo_url:
                  type: string
                  example: https://github.com/user/repo.git
                branch:
                  type: string
                  example: main
                commit_sha:
                  type: string
                  format: uuid
                  example: abc123def4567890123456789012345678901234
                original_commit_sha:
                  type: string
                  nullable: true
                author_name:
                  type: string
                  example: John Doe
                author_email:
                  type: string
                  format: email
                  example: john@example.com
                content:
                  type: string
                  description: Authorship log content
      responses:
        '200':
          description: Note created or updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  data:
                    type: object
                    properties:
                      id:
                        type: string

  /worker/notes/get:
    post:
      summary: Get a single note
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - repo_url
                - commit_sha
              properties:
                repo_url:
                  type: string
                commit_sha:
                  type: string
      responses:
        '200':
          description: Note found
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/Note'
        '404':
          description: Note not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /worker/notes/batch:
    post:
      summary: Batch get notes
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - repo_url
                - commit_shas
              properties:
                repo_url:
                  type: string
                commit_shas:
                  type: array
                  items:
                    type: string
      responses:
        '200':
          description: Batch notes retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  data:
                    type: object
                    properties:
                      notes:
                        type: array
                        items:
                          type: object
                          properties:
                            commit_sha:
                              type: string
                            content:
                              type: string
                      missing:
                        type: array
                        items:
                          type: string

  /worker/notes/push:
    post:
      summary: Batch push (create/update) notes
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - repo_url
                - notes
              properties:
                repo_url:
                  type: string
                notes:
                  type: array
                  items:
                    type: object
                    required:
                      - branch
                      - commit_sha
                      - author_name
                      - author_email
                      - content
                    properties:
                      branch:
                        type: string
                      commit_sha:
                        type: string
                      original_commit_sha:
                        type: string
                        nullable: true
                      author_name:
                        type: string
                      author_email:
                        type: string
                      content:
                        type: string
      responses:
        '200':
          description: Notes pushed
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  data:
                    type: object
                    properties:
                      created:
                        type: integer
                      updated:
                        type: integer

  /worker/authorship_notes/rewrite:
    post:
      summary: Rewrite authorship notes
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RewriteNotesRequest'
      responses:
        '200':
          description: Rewrite processed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RewriteNotesResponse'
        '400':
          description: Invalid rewrite request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: rewrite_id exists with different request content
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /worker/notes/rewrite:
    post:
      summary: Rewrite authorship notes compatibility alias
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RewriteNotesRequest'
      responses:
        '200':
          description: Rewrite processed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RewriteNotesResponse'
        '400':
          description: Invalid rewrite request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: rewrite_id exists with different request content
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /worker/notes/list:
    post:
      summary: List all commit SHAs with notes for a repository
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - repo_url
              properties:
                repo_url:
                  type: string
      responses:
        '200':
          description: List of commit SHAs
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  data:
                    type: object
                    properties:
                      commit_shas:
                        type: array
                        items:
                          type: string

  /worker/notes/search:
    post:
      summary: Search notes by content pattern
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - repo_url
                - pattern
              properties:
                repo_url:
                  type: string
                pattern:
                  type: string
                  description: Search pattern (uses LIKE)
      responses:
        '200':
          description: Matching commit SHAs
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  data:
                    type: object
                    properties:
                      commit_shas:
                        type: array
                        items:
                          type: string

components:
  schemas:
    Note:
      type: object
      properties:
        id:
          type: string
        commit_sha:
          type: string
        branch:
          type: string
        author_name:
          type: string
        author_email:
          type: string
        content:
          type: string
        created_at:
          type: integer
          format: int64
        updated_at:
          type: integer
          format: int64

    RewriteNotesRequest:
      type: object
      required:
        - repo_url
        - rewrite_id
        - operation
        - branch
        - mappings
      properties:
        repo_url:
          type: string
          minLength: 1
        rewrite_id:
          type: string
          minLength: 1
        operation:
          type: string
          minLength: 1
          enum:
            - rebase_conflict_manual_commit
            - rebase_complete
            - cherry_pick_complete
            - amend
        branch:
          type: string
          minLength: 1
        original_head:
          type: string
          nullable: true
        new_head:
          type: string
          nullable: true
        mappings:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/RewriteNotesMapping'

    RewriteNotesMapping:
      type: object
      required:
        - source_commit
        - target_commit
        - target_content
        - author_name
        - author_email
        - disposition
      properties:
        source_commit:
          type: string
          minLength: 1
          description: Source commit being replaced; must differ from target_commit.
        target_commit:
          type: string
          minLength: 1
          description: Target commit that replaces source_commit; must differ from source_commit.
        source_note_blob_oid:
          type: string
          minLength: 1
          nullable: true
        target_note_blob_oid:
          type: string
          minLength: 1
          nullable: true
        target_content:
          type: string
          minLength: 1
        commit_time:
          type: integer
          format: int64
        author_name:
          type: string
          minLength: 1
        author_email:
          type: string
          minLength: 1
        disposition:
          type: string
          minLength: 1
          enum:
            - supersede_source

    RewriteNotesResponse:
      type: object
      required:
        - ok
        - data
      properties:
        ok:
          type: boolean
        data:
          type: object
          required:
            - created
            - updated
            - superseded
            - unchanged
            - conflicts
          properties:
            created:
              type: integer
            updated:
              type: integer
            superseded:
              type: integer
            unchanged:
              type: integer
            conflicts:
              type: array
              items:
                $ref: '#/components/schemas/RewriteNotesConflict'

    RewriteNotesConflict:
      type: object
      properties:
        source_commit:
          type: string
        target_commit:
          type: string
        reason:
          type: string
          enum:
            - target_note_conflict
            - source_note_missing
            - source_already_superseded
        remote_content_hash:
          type: string
        local_content_hash:
          type: string

    Error:
      type: object
      properties:
        ok:
          type: boolean
          enum: [false]
        error:
          type: string

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    apiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
