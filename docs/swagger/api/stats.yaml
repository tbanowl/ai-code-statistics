tags:
  - name: stats
    description: 统计分析 API

endpoints:
  /api/stats/analyze:
    POST:
      summary: 执行统计分析
      description: 根据指定的日期范围和部门，统计分析 AI 代码占比
      parameters:
        - name: body
          in: body
          required: true
          schema:
            type: object
            properties:
              start_date:
                type: string
                format: date
                description: 开始日期 (ISO 8601 格式)
              end_date:
                type: string
                format: date
                description: 结束日期 (ISO 8601 格式)
              departments:
                type: array
                items:
                  type: string
                description: 选中的部门列表 (可选)
      responses:
        '200':
          description: 统计分析结果
          schema:
            type: object
            properties:
              success:
                type: boolean
              data:
                type: object
                properties:
                  total_lines:
                    type: integer
                  total_ai_lines:
                    type: integer
                  human_lines:
                    type: integer
                  ai_percentage:
                    type: number
                  total_commits:
                    type: integer
                  commits_with_ai:
                    type: integer
                  tool_model_breakdown:
                    type: object
                  start_date:
                    type: string
                  end_date:
                    type: string
                  repos:
                    type: array
        '400':
          description: 请求参数错误
        '500':
          description: 服务器内部错误

  /api/stats/latest:
    GET:
      summary: 获取最新统计结果
      description: 获取指定粒度的最新统计结果
      parameters:
        - name: granularity
          in: query
          type: string
          enum: [day, week, month]
          default: day
          description: 统计粒度 (day/week/month)
      responses:
        '200':
          description: 最新统计结果
          schema:
            $ref: '#/definitions/SuccessResponse'
        '404':
          description: 暂无统计数据
        '500':
          description: 服务器内部错误

  /api/stats/history:
    GET:
      summary: 获取统计历史记录
      description: 获取指定粒度的历史统计记录
      parameters:
        - name: granularity
          in: query
          type: string
          enum: [day, week, month]
          default: day
          description: 统计粒度 (day/week/month)
        - name: limit
          in: query
          type: integer
          default: 100
          description: 返回记录数量限制
      responses:
        '200':
          description: 历史统计记录
          schema:
            type: object
            properties:
              success:
                type: boolean
              data:
                type: array
                items:
                  type: object
        '500':
          description: 服务器内部错误
